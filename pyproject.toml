[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rba-demo-kaze"
version = "0.1.0"
description = "Kaze Labs' employee portal: a second relying party that signs in through RokuSec (U-5)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Juan Ignacio Gonzalez" }]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "rba-contracts>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rba_demo_kaze = [
  "web/templates/*.html",
  "web/static/*",
  "web/static/fonts/*",
  "web/static/brand/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
